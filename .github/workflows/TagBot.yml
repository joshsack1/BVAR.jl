name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: How many days back to look for untagged releases
        default: "3"
        required: false

permissions:
  actions: read
  checks: read
  contents: write # TagBot creates the git tag for each registered release
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # The registry triggers this by commenting as JuliaTagBot; everything else
    # that comments on an issue must not start a release.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so
          # without this key Documenter.yml's `tags: ["*"]` trigger would never
          # fire and versioned docs would never build. Pushing over SSH does
          # trigger it.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
