name: Documentation

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded PR and branch builds freely, but never interrupt a main or
  # tag build mid-deploy: a half-finished deploydocs can leave gh-pages in a
  # partially written state.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    # Turing's precompilation dominates a cold build.
    timeout-minutes: 60
    permissions:
      contents: write # deploydocs pushes to gh-pages using GITHUB_TOKEN
      pull-requests: read
      statuses: write
      actions: write # julia-actions/cache prunes superseded caches
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          # The package's compat floor is 1.12, but the docs environment resolves
          # its own manifest, so track latest stable.
          version: "1"
          arch: x64

      - uses: julia-actions/cache@v2

      # No Pkg.develop step: docs/Project.toml declares
      # [sources] BayesianVectorAutoregressions = { path = ".." }, so instantiate resolves the parent
      # package straight from the checkout. This is the same command a local
      # build runs.
      - name: Instantiate docs environment
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # deploydocs prefers this SSH deploy key over GITHUB_TOKEN. It is what
          # makes tag-triggered builds work at all: TagBot pushes release tags
          # over SSH, and a tag pushed with GITHUB_TOKEN would not fire the
          # `tags: ["*"]` trigger above.
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          # GR renders headless on the runner.
          GKSwstype: "100"
