name: CompatHelper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Install CompatHelper
        run: julia --color=yes -e 'using Pkg; Pkg.add("CompatHelper")'

      # Root and docs only. benchmark/Project.toml has no [compat] section and is
      # not part of the registered package, so including it would open PRs for an
      # environment nobody installs.
      - name: Run CompatHelper
        run: julia --color=yes -e 'using CompatHelper; CompatHelper.main(; subdirs = ["", "docs"])'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
