name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Same rule as the docs workflow: cancel superseded PR and branch runs freely,
  # but let main and tag runs finish so a release commit always gets a complete
  # coverage upload.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    # Turing's precompilation dominates a cold run, same as the docs build.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # julia-actions/cache prunes superseded caches
    strategy:
      # Never let a failure on the compat floor hide the result on latest stable.
      fail-fast: false
      matrix:
        version:
          - "1.12" # the floor declared in Project.toml
          - "1" # latest stable
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64

      - uses: julia-actions/cache@v2

      # Resolves a fresh manifest per job. This is why the root Manifest.toml is
      # untracked: a tracked one would test a single pinned dependency set rather
      # than the range [compat] claims to support.
      - uses: julia-actions/julia-buildpkg@v1

      # Runs Pkg.test(), which picks up the Aqua extra from Project.toml's
      # [targets]. No separate QA job is needed.
      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A flaky coverage upload must never turn a passing test run red — the
          # badge is cited in the docs as evidence that the suite passes.
          fail_ci_if_error: false
