## Environment for the Julia<->R BVAR cross-language comparison harness.
##
## Deliberately minimal: no CSV.jl, no DelimitedFiles-adjacent helpers, no
## plotting. All CSV I/O in this directory is hand-rolled (a few lines of
## `split`/`join`/`@printf`), so the harness measures the package under test
## and nothing else, and so the environment resolves fast and stays stable.

